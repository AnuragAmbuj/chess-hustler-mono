apiVersion: apps/v1
kind: Deployment
metadata:
  name: hustle-server
  namespace: hustle
  labels:
    app: hustle-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hustle-server
  template:
    metadata:
      labels:
        app: hustle-server
    spec:
      containers:
        - name: server
          # Placeholder image ref; CI builds/pushes real tags from release.yml.
          image: ghcr.io/chess-hustle/hustle-server:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: hustle-server-config
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
