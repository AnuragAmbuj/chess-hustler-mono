openapi: 3.1.0
info:
  title: Chess Hustle API
  version: 0.1.0
  description: >-
    Phase 0 skeleton (health/ready/meta). Phase 1 expands per
    docs/03-api/rest.md. Drift gate: adding a route to hustle-api without
    adding it here fails CI (tests/contract_drift.rs), and vice versa.
servers:
  - url: http://localhost:8080
    description: local
paths:
  /:
    get:
      operationId: getRoot
      summary: Service banner
      tags:
        - meta
      responses:
        '200':
          description: Service banner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Banner'
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness (process up; never checks dependencies)
      tags:
        - meta
      responses:
        '200':
          description: Alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness (dependency checks land in Phase 1)
      tags:
        - meta
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
  /v1/meta/config:
    get:
      operationId: getMetaConfig
      summary: Public client boot config (economy display values, ad rules, TC presets)
      tags:
        - meta
      responses:
        '200':
          description: Boot config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaConfig'
  /v1/auth/otp/send:
    post:
      operationId: postAuthOtpSend
      summary: Send SMS OTP
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpSendRequest'
      responses:
        '204':
          description: OTP sent
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
  /v1/auth/otp/verify:
    post:
      operationId: postAuthOtpVerify
      summary: Verify SMS OTP and complete signup/login
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: Token pair and user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
  /v1/auth/refresh:
    post:
      operationId: postAuthRefresh
      summary: Rotate refresh token and issue new access token
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Rotated token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /v1/auth/logout:
    post:
      operationId: postAuthLogout
      summary: Revoke current session
      tags:
        - auth
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Current session revoked
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /v1/auth/logout-all:
    post:
      operationId: postAuthLogoutAll
      summary: Revoke all sessions for the authenticated user
      tags:
        - auth
      security:
        - BearerAuth: []
      responses:
        '204':
          description: All sessions revoked
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /v1/me:
    get:
      operationId: getMe
      summary: Current user profile, balances, settings, ratings
      tags:
        - me
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMe'
        '401':
          $ref: '#/components/responses/ErrorResponse'
    patch:
      operationId: patchMe
      summary: Update profile or user settings
      tags:
        - me
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchMeRequest'
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMe'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
    delete:
      operationId: deleteMe
      summary: Request DPDP account erasure with 30-day grace period
      tags:
        - me
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Deletion scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionScheduledResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /v1/me/deletion-cancel:
    post:
      operationId: postMeDeletionCancel
      summary: Cancel pending deletion request within grace period
      tags:
        - me
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Deletion request cancelled
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /v1/me/export:
    get:
      operationId: getMeExport
      summary: Export personal data bundle under DPDP Act right to access
      tags:
        - me
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Personal data export bundle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataExportResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /v1/me/gold:
    get:
      operationId: getMeGold
      summary: Balance and paginated ledger history
      tags:
        - me
      security:
        - BearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 25
      responses:
        '200':
          description: Gold balance and ledger history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoldLedgerPage'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /v1/me/daily:
    get:
      operationId: getDailyStreak
      summary: Daily streak status and next reward
      tags:
        - rewards
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Daily streak status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyStreakResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /v1/me/daily/claim:
    post:
      operationId: claimDailyStreak
      summary: Claim daily streak reward
      tags:
        - rewards
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Daily streak claim result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyClaimResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /v1/me/gold/summary:
    get:
      operationId: getGoldSummary
      summary: Gold balance and 30-day breakdown
      tags:
        - rewards
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Gold summary and breakdown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoldSummaryResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /v1/me/missions:
    get:
      operationId: getMyMissions
      summary: Retrieve active daily and weekly missions
      tags:
        - rewards
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of active missions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MissionItem'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /v1/me/missions/{id}/claim:
    post:
      operationId: claimMission
      summary: Claim completed mission reward
      tags:
        - rewards
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Mission claim result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimMissionResult'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
  /v1/me/achievements:
    get:
      operationId: getMyAchievements
      summary: Retrieve milestone achievements with user progress
      tags:
        - rewards
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of milestone achievements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AchievementItem'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /v1/players/{handle}:
    get:
      operationId: getPlayerProfile
      summary: Public player profile
      tags:
        - players
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Public player profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerProfile'
        '404':
          $ref: '#/components/responses/ErrorResponse'
  /v1/players/{handle}/games:
    get:
      operationId: getPlayerGames
      summary: Public rated and casual games feed for player
      tags:
        - players
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
        - name: cursor
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 25
      responses:
        '200':
          description: Public player games feed page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerGamesPage'
        '404':
          $ref: '#/components/responses/ErrorResponse'
  /v1/leaderboards:
    get:
      operationId: getLeaderboard
      summary: Retrieve top-ranked players by pool
      tags:
        - ratings
        - leaderboards
      parameters:
        - name: pool
          in: query
          required: false
          schema:
            type: string
            enum: [bullet, blitz, rapid, classical]
            default: blitz
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Leaderboard snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaderboardResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /v1/matchmaking/queue:
    post:
      operationId: joinMatchmakingQueue
      summary: Join matchmaking queue
      tags:
        - matchmaking
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueJoinRequest'
      responses:
        '202':
          description: Enqueued into matchmaking
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueJoinResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
    delete:
      operationId: leaveMatchmakingQueue
      summary: Leave matchmaking queue
      tags:
        - matchmaking
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Successfully left queue
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /v1/matchmaking/status:
    get:
      operationId: getMatchmakingStatus
      summary: Get matchmaking queue status
      tags:
        - matchmaking
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current queue status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchmakingStatusResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /v1/realtime/ticket:
    get:
      operationId: getRealtimeTicket
      summary: Obtain single-use 30s WebSocket ticket
      description: Returns a single-use token to pass as ?ticket= query param to /ws
      tags:
        - realtime
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Ticket issued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealtimeTicketResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /v1/games/{id}:
    get:
      operationId: getGame
      summary: Full game snapshot
      description: Returns full game snapshot including FEN, clocks, players, status, and move plies
      tags:
        - games
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Full game snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameSnapshot'
        '404':
          $ref: '#/components/responses/ErrorResponse'
  /v1/games/{id}/moves:
    get:
      operationId: getGameMoves
      summary: List of plies played
      tags:
        - games
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: cursor
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 25
      responses:
        '200':
          description: Move plies page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameMovesPage'
        '404':
          $ref: '#/components/responses/ErrorResponse'
  /v1/games/{id}/pgn:
    get:
      operationId: getGamePgn
      summary: Export game in PGN format
      tags:
        - games
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Game in PGN format
          content:
            application/x-chess-pgn:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/ErrorResponse'
  /v1/games/{id}/resign:
    post:
      operationId: resignGame
      summary: Resign active game
      tags:
        - games
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Game resigned outcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameResignResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
  /v1/games/{id}/draw-offer:
    post:
      operationId: drawOffer
      summary: Offer a draw to opponent
      tags:
        - games
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Draw offered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DrawOfferResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
  /v1/games/{id}/draw-accept:
    post:
      operationId: drawAccept
      summary: Accept opponent's draw offer
      tags:
        - games
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Game drawn by mutual agreement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameResignResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
  /v1/games/{id}/draw-decline:
    post:
      operationId: drawDecline
      summary: Decline opponent's draw offer
      tags:
        - games
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Draw declined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DrawOfferResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
  /v1/games/{id}/abort:
    post:
      operationId: abortGame
      summary: Abort game (valid <= 4 plies)
      tags:
        - games
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Game aborted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameAbortResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
  /v1/games/{id}/claim-timeout:
    post:
      operationId: claimTimeout
      summary: Claim win or draw when opponent clock expires
      tags:
        - games
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Game finished on timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameResignResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
  /v1/friends:
    get:
      operationId: getFriends
      summary: List accepted friends with live presence
      tags:
        - friends
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of friends
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FriendInfo'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /v1/friends/requests:
    get:
      operationId: getFriendRequests
      summary: List pending incoming and outgoing friend requests
      tags:
        - friends
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Pending friend requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequestsResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
    post:
      operationId: sendFriendRequest
      summary: Send friend request by handle
      tags:
        - friends
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandleRequest'
      responses:
        '201':
          description: Friend request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequestItem'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
  /v1/friends/requests/{id}/accept:
    post:
      operationId: acceptFriendRequest
      summary: Accept a friend request
      tags:
        - friends
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Request accepted
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
  /v1/friends/requests/{id}/decline:
    post:
      operationId: declineFriendRequest
      summary: Decline a friend request
      tags:
        - friends
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Request declined
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
  /v1/friends/{id}:
    delete:
      operationId: deleteFriend
      summary: Remove friendship
      tags:
        - friends
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Friend removed
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
  /v1/blocks:
    get:
      operationId: getBlocks
      summary: List blocked users
      tags:
        - friends
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of blocked users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BlockedUserItem'
        '401':
          $ref: '#/components/responses/ErrorResponse'
    post:
      operationId: blockUser
      summary: Block user by handle
      tags:
        - friends
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandleRequest'
      responses:
        '201':
          description: User blocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockedUserItem'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
  /v1/blocks/{handle}:
    delete:
      operationId: unblockUser
      summary: Unblock user by handle
      tags:
        - friends
      security:
        - BearerAuth: []
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: User unblocked
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /v1/challenge:
    post:
      operationId: createChallenge
      summary: Create direct challenge
      tags:
        - friends
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChallengeRequest'
      responses:
