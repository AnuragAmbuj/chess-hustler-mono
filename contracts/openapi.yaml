components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    ErrorResponse:
      description: Error envelope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    Status:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
            - ready
    Banner:
      type: object
      required:
        - service
        - version
      properties:
        service:
          type: string
          const: chess-hustle
        version:
          type: string
    MetaConfig:
      type: object
      required:
        - server_time_unix_ms
        - economy
        - ads
        - time_controls
      properties:
        server_time_unix_ms:
          type: integer
        economy:
          type: object
          required:
            - welcome_gold
          properties:
            welcome_gold:
              type: integer
        ads:
          type: object
          required:
            - gold_per_ad
            - max_per_day
            - cooldown_s
          properties:
            gold_per_ad:
              type: integer
            max_per_day:
              type: integer
            cooldown_s:
              type: integer
        time_controls:
          type: array
          items:
            type: object
            required:
              - initial_s
              - increment_s
              - pool
            properties:
              initial_s:
                type: integer
              increment_s:
                type: integer
              pool:
                type: string
                enum:
                  - bullet
                  - blitz
                  - rapid
                  - classical
    OtpSendRequest:
      type: object
      required:
        - phone
      properties:
        phone:
          type: string
          example: "+919876543210"
    Consents:
      type: object
      required:
        - essential
        - functional
        - marketing
        - personalised_ads
      properties:
        essential:
          type: boolean
        functional:
          type: boolean
        marketing:
          type: boolean
        personalised_ads:
          type: boolean
    ProfileInput:
      type: object
      required:
        - handle
      properties:
        handle:
          type: string
          example: "ananya_plays"
        display_name:
          type: string
          example: "Ananya"
    OtpVerifyRequest:
      type: object
      required:
        - phone
        - code
        - age_confirmed
        - consents
        - profile
      properties:
        phone:
          type: string
          example: "+919876543210"
        code:
          type: string
          example: "482913"
        age_confirmed:
          type: boolean
        consents:
          $ref: '#/components/schemas/Consents'
        profile:
          $ref: '#/components/schemas/ProfileInput'
    RefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
    RefreshResponse:
      type: object
      required:
        - access_token
        - expires_in
        - refresh_token
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
        refresh_token:
          type: string
    RatingsMap:
      type: object
      required:
        - bullet
        - blitz
        - rapid
        - classical
      properties:
        bullet:
          type: integer
        blitz:
          type: integer
        rapid:
          type: integer
        classical:
          type: integer
    UserSelf:
      type: object
      required:
        - id
        - handle
        - display_name
        - gold
        - ratings
        - provisional
      properties:
        id:
          type: string
        handle:
          type: string
        display_name:
          type: string
        gold:
          type: integer
        ratings:
          $ref: '#/components/schemas/RatingsMap'
        provisional:
          type: boolean

    AuthResponse:
      type: object
      required:
        - access_token
        - expires_in
        - refresh_token
        - user
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
        refresh_token:
          type: string
        user:
          $ref: '#/components/schemas/UserSelf'
    ApiError:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
    UserSettings:
      type: object
      required:
        - chat_enabled
        - sound_enabled
        - premove_enabled
        - quiet_hours_start
        - quiet_hours_end
        - marketing_opt_in
      properties:
        chat_enabled:
          type: boolean
        sound_enabled:
