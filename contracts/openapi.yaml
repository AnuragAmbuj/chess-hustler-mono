      required:
        - status
      properties:
        status:
          type: string
          example: "ok"
        transaction_id:
          type: string
    Tournament:
      type: object
      required:
        - id
        - public_id
        - name
        - tc
        - rounds
        - round_minutes
        - status
        - starts_at
        - registration_closes_at
        - capacity
        - prize_config
        - created_by
      properties:
        id:
          type: integer
          format: int64
        public_id:
          type: string
        name:
          type: string
        tc:
          type: object
        rounds:
          type: integer
        round_minutes:
          type: integer
        status:
          type: string
          enum: [scheduled, registering, running, finished, cancelled]
        starts_at:
          type: string
          format: date-time
        registration_closes_at:
          type: string
          format: date-time
        capacity:
          type: integer
        prize_config:
          type: object
        created_by:
          type: integer
          format: int64
    TournamentEntry:
      type: object
      required:
        - tournament_id
        - user_id
        - joined_at
        - withdrawn
      properties:
        tournament_id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        joined_at:
          type: string
          format: date-time
        withdrawn:
          type: boolean
        final_rank:
          type: integer
          nullable: true
        prize_gold:
          type: integer
          format: int64
          nullable: true
    TournamentPairing:
      type: object
      required:
        - id
        - tournament_id
        - round
        - board
      properties:
        id:
          type: integer
          format: int64
        tournament_id:
          type: integer
          format: int64
        round:
          type: integer
        board:
          type: integer
        white_id:
          type: integer
          format: int64
          nullable: true
        black_id:
          type: integer
          format: int64
          nullable: true
        game_id:
          type: integer
          format: int64
          nullable: true
        result:
          type: string
          nullable: true
    StandingItem:
      type: object
      required:
        - rank
        - user_id
        - handle
        - points
        - buchholz
        - sonneborn_berger
        - games_played
        - wins
        - draws
        - losses
      properties:
        rank:
          type: integer
        user_id:
          type: integer
          format: int64
        handle:
          type: string
        points:
          type: number
        buchholz:
          type: number
        sonneborn_berger:
          type: number
        games_played:
          type: integer
        wins:
          type: integer
        draws:
          type: integer
        losses:
          type: integer
    TournamentDetail:
      type: object
      required:
        - tournament
        - entries_count
        - standings
        - pairings
      properties:
        tournament:
          $ref: '#/components/schemas/Tournament'
        entries_count:
          type: integer
          format: int64
        my_entry:
          $ref: '#/components/schemas/TournamentEntry'
          nullable: true
        standings:
          type: array
          items:
            $ref: '#/components/schemas/StandingItem'
        pairings:
          type: array
          items:
            $ref: '#/components/schemas/TournamentPairing'
    CreateTournamentRequest:
      type: object
      required:
        - name
        - tc
        - rounds
        - round_minutes
        - starts_at
        - registration_closes_at
        - capacity
      properties:
        name:
          type: string
        tc:
          type: object
        rounds:
          type: integer
        round_minutes:
          type: integer
        starts_at:
          type: string
          format: date-time
        registration_closes_at:
          type: string
          format: date-time
        capacity:
          type: integer
        prize_config:
          type: object
    LeaderboardEntry:
      type: object
      required:
        - rank
        - user_id
        - handle
        - rating
        - rd
        - games_count
      properties:
        rank:
          type: integer
          example: 1
        user_id:
          type: string
          format: uuid
        handle:
          type: string
          example: gukesh_d
        display_name:
          type: string
          example: D Gukesh
        rating:
          type: integer
          example: 2750
        rd:
          type: number
          example: 45.2
        peak_rating:
          type: integer
          example: 2780
        games_count:
          type: integer
          example: 320
        win_count:
          type: integer
          example: 210
        loss_count:
          type: integer
          example: 45
        draw_count:
          type: integer
          example: 65
    LeaderboardResponse:
      type: object
      required:
        - pool
        - updated_at
        - entries
      properties:
        pool:
          type: string
          enum: [bullet, blitz, rapid, classical]
        updated_at:
          type: string
          format: date-time
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LeaderboardEntry'




